<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Carga la cabecera común y establece el título de la página. -->
<head th:replace="fragments/head :: head (#{msg.etiqueta.form.title})"></head>

<body>

<!-- Cabecera común de la aplicación. -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido principal de la página. -->
<main class="container mt-5">

    <!-- Muestra un título diferente dependiendo de si se crea o edita una etiqueta. -->
    <h1 th:text="${etiqueta.id == null} ? #{msg.etiqueta.form.add} : #{msg.etiqueta.form.edit}"></h1>

    <!-- Muestra un mensaje de error si existe alguno. -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Formulario para crear o actualizar una etiqueta.
         La dirección cambia dependiendo de si la etiqueta tiene ID. -->
    <form th:action="${etiqueta.id == null} ? @{/etiquetas/insert} : @{/etiquetas/update}"
          th:object="${etiqueta}"
          method="post"
          class="mt-4">

        <!-- Campo oculto para conservar el identificador de la etiqueta al editarla. -->
        <input type="hidden" th:field="*{id}" />

        <!-- Campo para introducir el código de barras de la etiqueta. -->
        <div class="mb-3">
            <label for="codigoBarras" class="form-label" th:text="#{msg.etiqueta.form.codigoBarras}">Código de barras:</label>
            <input type="text" th:field="*{codigoBarras}" id="codigoBarras" class="form-control" />

            <!-- Muestra los errores de validación del campo código de barras. -->
            <div th:if="${#fields.hasErrors('codigoBarras')}" class="text-danger" th:errors="*{codigoBarras}"></div>
        </div>

        <!-- Desplegable para seleccionar la caja a la que pertenece la etiqueta. -->
        <div class="mb-3">
            <label for="caja" class="form-label" th:text="#{msg.etiqueta.form.caja}">Caja:</label>
            <select th:field="*{caja.id}" id="caja" class="form-select">

                <!-- Opción inicial para no seleccionar ninguna caja. -->
                <option value="" th:text="#{msg.etiqueta.form.caja.select}"></option>

                <!-- Recorre la lista de cajas recibida desde el controlador
                     y muestra su ID y su contenido como opción del desplegable. -->
                <option th:each="caja : ${listCajas}"
                        th:value="${caja.id}"
                        th:text="${caja.id + ' - ' + caja.contenido}"></option>
            </select>

            <!-- Muestra los errores de validación de la caja seleccionada. -->
            <div th:if="${#fields.hasErrors('caja.id')}" class="text-danger" th:errors="*{caja.id}"></div>
        </div>

        <!-- Botón para enviar el formulario.
             Su texto cambia dependiendo de si se crea o actualiza la etiqueta. -->
        <button type="submit"
                class="btn btn-primary"
                th:text="${etiqueta.id == null} ? #{msg.etiqueta.form.create} : #{msg.etiqueta.form.update}">
        </button>

    </form>

    <!-- Enlace para volver a la lista de etiquetas sin enviar el formulario. -->
    <a th:href="@{/etiquetas}" class="btn btn-secondary mt-3"
       th:text="#{msg.etiqueta.form.back}">Volver a la lista</a>

</main>

<!-- Pie de página común de la aplicación. -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
