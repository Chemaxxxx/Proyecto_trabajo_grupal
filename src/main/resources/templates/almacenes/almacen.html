<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Carga la cabecera común y establece el título de la página. -->
<head th:replace="fragments/head :: head (#{msg.almacen.list.title})"></head>

<body>

<!-- Cabecera común de la aplicación. -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido principal de la página. -->
<main class="container mt-5">

    <!-- Título de la página donde se muestra el listado de almacenes. -->
    <h1 th:text="#{msg.almacen.list.heading}">Almacenes</h1>

    <!-- Muestra un mensaje de error si existe alguno. -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Tabla que muestra los almacenes registrados. -->
    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <!-- Columnas que indican los datos que se muestran de cada almacén. -->
            <th th:text="#{msg.almacen.table.id}">ID</th>
            <th th:text="#{msg.almacen.table.ciudad}">Ciudad</th>
            <th th:text="#{msg.almacen.table.licencia}">Licencia</th>
            <th th:text="#{msg.almacen.table.actions}">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <!-- Recorre la lista de almacenes recibida desde el controlador. -->
        <tr th:each="almacen : ${listAlmacenes}">
            <!-- Muestra el identificador y la ciudad de cada almacén. -->
            <td th:text="${almacen.id}"></td>
            <td th:text="${almacen.ciudad}"></td>

            <!-- Muestra la fecha de matriculación de la licencia o un texto si no tiene. -->
            <td th:text="${almacen.licenciaAlmacen != null} ? ${almacen.licenciaAlmacen.diaMatriculacion} : #{msg.almacen.noLicencia}"></td>

            <td>
                <!-- Enlace para acceder al formulario de edición del almacén seleccionado. -->
                <a th:href="@{/almacenes/edit(id=${almacen.id})}"
                   class="btn btn-primary btn-sm"
                   th:text="#{msg.almacen.button.edit}">Editar</a>

                <!-- Formulario para eliminar el almacén mediante una petición POST. -->
                <form th:action="@{/almacenes/delete}" method="post" class="d-inline">

                    <!-- Campo oculto que envía el ID del almacén que se quiere eliminar. -->
                    <input type="hidden" name="id" th:value="${almacen.id}"/>

                    <!-- Botón para eliminar el almacén, mostrando antes un mensaje de confirmación. -->
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            th:onclick="|return confirm('#{msg.almacen.delete.confirm}');|"
                            th:text="#{msg.almacen.button.delete}">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Enlace para abrir el formulario de creación de un nuevo almacén. -->
    <a th:href="@{/almacenes/new}" class="btn btn-success mt-3"
       th:text="#{msg.almacen.button.add}">Añadir almacén</a>

    <!-- Enlace para volver a la página principal de la aplicación. -->
    <a th:href="@{/}" class="btn btn-secondary mt-3"
       th:text="#{msg.almacen.button.back}">Volver al inicio</a>

</main>

<!-- Pie de página común de la aplicación. -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
