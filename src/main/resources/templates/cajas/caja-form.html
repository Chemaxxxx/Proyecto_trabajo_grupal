<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Carga la cabecera común y establece el título de la página. -->
<head th:replace="fragments/head :: head (#{msg.caja.form.title})"></head>

<body>

<!-- Cabecera común de la aplicación. -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido principal de la página. -->
<main class="container mt-5">

    <!-- Muestra un título diferente dependiendo de si se crea o edita una caja. -->
    <h1 th:text="${caja.id == null} ? #{msg.caja.form.add} : #{msg.caja.form.edit}"></h1>

    <!-- Muestra un mensaje de error si existe alguno. -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Formulario para crear o actualizar una caja.
         La dirección cambia dependiendo de si la caja tiene ID. -->
    <form th:action="${caja.id == null} ? @{/cajas/insert} : @{/cajas/update}"
          th:object="${caja}"
          method="post"
          class="mt-4">

        <!-- Campo oculto para conservar el identificador de la caja al editarla. -->
        <input type="hidden" th:field="*{id}" />

        <!-- Campo para introducir el peso de la caja. -->
        <div class="mb-3">
            <label for="peso" class="form-label" th:text="#{msg.caja.form.peso}">Peso (kg):</label>
            <input type="text" th:field="*{peso}" id="peso" class="form-control" />

            <!-- Muestra los errores de validación del campo peso. -->
            <div th:if="${#fields.hasErrors('peso')}" class="text-danger" th:errors="*{peso}"></div>
        </div>

        <!-- Campo para introducir el contenido de la caja. -->
        <div class="mb-3">
            <label for="contenido" class="form-label" th:text="#{msg.caja.form.contenido}">Contenido:</label>
            <input type="text" th:field="*{contenido}" id="contenido" class="form-control" />

            <!-- Muestra los errores de validación del campo contenido. -->
            <div th:if="${#fields.hasErrors('contenido')}" class="text-danger" th:errors="*{contenido}"></div>
        </div>

        <!-- Desplegable para seleccionar la estantería en la que está la caja. -->
        <div class="mb-3">
            <label for="estanteria" class="form-label" th:text="#{msg.caja.form.estanteria}">Estantería:</label>
            <select th:field="*{estanteria.id}" id="estanteria" class="form-select">

                <!-- Opción inicial para no seleccionar ninguna estantería. -->
                <option value="" th:text="#{msg.caja.form.estanteria.select}"></option>

                <!-- Recorre la lista de estanterías recibida desde el controlador
                     y muestra su ID y su material como opción del desplegable. -->
                <option th:each="estanteria : ${listEstanterias}"
                        th:value="${estanteria.id}"
                        th:text="${estanteria.id + ' - ' + estanteria.material}"></option>
            </select>

            <!-- Muestra los errores de validación de la estantería seleccionada. -->
            <div th:if="${#fields.hasErrors('estanteria.id')}" class="text-danger" th:errors="*{estanteria.id}"></div>
        </div>

        <!-- Botón para enviar el formulario.
             Su texto cambia dependiendo de si se crea o actualiza la caja. -->
        <button type="submit"
                class="btn btn-primary"
                th:text="${caja.id == null} ? #{msg.caja.form.create} : #{msg.caja.form.update}">
        </button>

    </form>

    <!-- Enlace para volver a la lista de cajas sin enviar el formulario. -->
    <a th:href="@{/cajas}" class="btn btn-secondary mt-3"
       th:text="#{msg.caja.form.back}">Volver a la lista</a>

</main>

<!-- Pie de página común de la aplicación. -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
