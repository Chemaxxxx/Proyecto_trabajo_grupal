<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Carga la cabecera común y establece el título de la página. -->
<head th:replace="fragments/head :: head (#{msg.licencia.form.title})"></head>

<body>

<!-- Cabecera común de la aplicación. -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido principal de la página. -->
<main class="container mt-5">

    <!-- Muestra un título diferente dependiendo de si se crea o edita una licencia. -->
    <h1 th:text="${licencia.id == null} ? #{msg.licencia.form.add} : #{msg.licencia.form.edit}"></h1>

    <!-- Muestra un mensaje de error si existe alguno. -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Formulario para crear o actualizar una licencia.
         La dirección cambia dependiendo de si la licencia tiene ID. -->
    <form th:action="${licencia.id == null} ? @{/licencias/insert} : @{/licencias/update}"
          th:object="${licencia}"
          method="post"
          enctype="multipart/form-data"
          class="mt-4">

        <!-- Campo oculto para conservar el identificador de la licencia al editarla. -->
        <input type="hidden" th:field="*{id}" />

        <!-- Campo oculto para conservar el nombre de la imagen actual al editarla. -->
        <input type="hidden" th:field="*{imagen}" />

        <!-- Campo para introducir el día de matriculación de la licencia. -->
        <div class="mb-3">
            <label for="diaMatriculacion" class="form-label" th:text="#{msg.licencia.form.diaMatriculacion}">Día de matriculación:</label>
            <input type="date" th:field="*{diaMatriculacion}" id="diaMatriculacion" class="form-control" />

            <!-- Muestra los errores de validación del campo día de matriculación. -->
            <div th:if="${#fields.hasErrors('diaMatriculacion')}" class="text-danger" th:errors="*{diaMatriculacion}"></div>
        </div>

        <!-- Campo para seleccionar el archivo de imagen de la licencia. -->
        <div class="mb-3">
            <label for="imageFile" class="form-label" th:text="#{msg.licencia.form.imagen}">Imagen:</label>
            <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*" />

            <!-- Muestra los errores de validación del campo imagen. -->
            <div th:if="${#fields.hasErrors('imagen')}" class="text-danger" th:errors="*{imagen}"></div>
        </div>

        <!-- Desplegable para seleccionar el almacén al que pertenece la licencia. -->
        <div class="mb-3">
            <label for="almacen" class="form-label" th:text="#{msg.licencia.form.almacen}">Almacén:</label>
            <select th:field="*{almacen.id}" id="almacen" class="form-select">

                <!-- Opción inicial para no seleccionar ningún almacén. -->
                <option value="" th:text="#{msg.licencia.form.almacen.select}"></option>

                <!-- Recorre la lista de almacenes recibida desde el controlador
                     y muestra su ID y su ciudad como opción del desplegable. -->
                <option th:each="almacen : ${listAlmacenes}"
                        th:value="${almacen.id}"
                        th:text="${almacen.id + ' - ' + almacen.ciudad}"></option>
            </select>

            <!-- Muestra los errores de validación del almacén seleccionado. -->
            <div th:if="${#fields.hasErrors('almacen.id')}" class="text-danger" th:errors="*{almacen.id}"></div>
        </div>

        <!-- Botón para enviar el formulario.
             Su texto cambia dependiendo de si se crea o actualiza la licencia. -->
        <button type="submit"
                class="btn btn-primary"
                th:text="${licencia.id == null} ? #{msg.licencia.form.create} : #{msg.licencia.form.update}">
        </button>

    </form>

    <!-- Enlace para volver a la lista de licencias sin enviar el formulario. -->
    <a th:href="@{/licencias}" class="btn btn-secondary mt-3"
       th:text="#{msg.licencia.form.back}">Volver a la lista</a>

</main>

<!-- Pie de página común de la aplicación. -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
